[package]
name = "patchpilot-sync"
description = "Live sync core: rig keys, link codes, end-to-end encryption of what goes to the relay. No network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
flate2 = "1.1.10"
patchpilot-core = { path = "../core" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spake2 = "0.4.0"
thiserror = "2.0.21"

[lints]
workspace = true
