[package]
name = "patchpilot-scanner"
description = "Plug-in, DAW and vendor-app scanners. Reads metadata only, never loads binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
json5 = "1.3.3"
patchpilot-core = { path = "../core" }
pelite = "0.10.0"
plist = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
walkdir = "2.5.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
