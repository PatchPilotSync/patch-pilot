[package]
name = "patchpilot-vault"
description = "Installer Vault: plug-in installers kept on the user's own storage, identified, hashed and organised by vendor and version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
patchpilot-core = { path = "../core" }
patchpilot-parity = { path = "../parity" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
