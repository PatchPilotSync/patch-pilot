[package]
name = "patchpilot-cli"
description = "Command-line scan and diff for alpha testers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "patchpilot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
patchpilot-core = { path = "../core" }
patchpilot-local = { path = "../local" }
patchpilot-parity = { path = "../parity" }
patchpilot-store = { path = "../store" }
serde = "1.0.229"
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
