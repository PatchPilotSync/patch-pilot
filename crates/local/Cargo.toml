[package]
name = "patchpilot-local"
description = "This machine: default folders, scanning it, app-data paths. Shared by the CLI and the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
notify = "8.2.0"
patchpilot-catalog = { path = "../catalog" }
patchpilot-core = { path = "../core" }
patchpilot-parity = { path = "../parity" }
patchpilot-scanner = { path = "../scanner" }
patchpilot-store = { path = "../store" }
patchpilot-sync = { path = "../sync" }
patchpilot-vault = { path = "../vault" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Git blob IDs for the GitHub backend (decision #73).
sha1_smol = "1.0.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
walkdir = "2.5.0"

[lints]
workspace = true

