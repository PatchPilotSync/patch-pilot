[package]
name = "patchpilot-local"
description = "This machine: default folders, scanning it, app-data paths. Shared by the CLI and the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
notify = "8.2.0"
patchpilot-core = { path = "../core" }
patchpilot-parity = { path = "../parity" }
patchpilot-scanner = { path = "../scanner" }
patchpilot-store = { path = "../store" }
patchpilot-sync = { path = "../sync" }
thiserror = "2.0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"

[lints]
workspace = true

