name: Release

# Builds the desktop app for macOS (Apple silicon and Intel) and Windows,
# signs the update packages and publishes them, with latest.json for the
# in-app updater, to the public PatchPilotSync/patch-pilot-releases repo
# (decision #32). Push a tag `v<version>` to run it; see docs/releasing.md.
#
# Secrets: RELEASES_TOKEN (contents: write on patch-pilot-releases),
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: PatchPilotSync/patch-pilot-releases

jobs:
  prepare:
    name: Check version and create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version everywhere
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          npm=$(jq -r .version app/package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/src-tauri/Cargo.toml | head -1)
          for v in "$conf" "$npm" "$cargo"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME, but tauri.conf.json=$conf package.json=$npm Cargo.toml=$cargo"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from app/CHANGELOG.md
        id: notes
        run: |
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          {
            echo "notes<<PATCHPILOT_NOTES_EOF"
            cat notes.md
            echo "PATCHPILOT_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          id=$(gh api -X POST "repos/$RELEASES_REPO/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish=main \
            -f name="Patch Pilot ${{ steps.version.outputs.version }}" \
            -F body=@notes.md \
            -F draft=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
      - name: Install front-end dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          owner: PatchPilotSync
          repo: patch-pilot-releases
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          updaterJsonPreferNsis: true

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # Only now does latest.json become "latest", so installed apps never see
      # a release that is missing a platform. The build jobs merge their
      # platform into latest.json in parallel, so check none got lost.
      - env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          release="repos/$RELEASES_REPO/releases/${{ needs.prepare.outputs.release_id }}"
          asset=$(gh api "$release" --jq '.assets[] | select(.name == "latest.json") | .id')
          gh api -H "Accept: application/octet-stream" "repos/$RELEASES_REPO/releases/assets/$asset" > latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$p" '.platforms[$p].signature | length > 0' latest.json > /dev/null; then
              echo "::error::latest.json has no signed $p build; re-run that build job, then this one"
              exit 1
            fi
          done
          gh api -X PATCH "repos/$RELEASES_REPO/releases/${{ needs.prepare.outputs.release_id }}" \
            -F draft=false -f make_latest=true
