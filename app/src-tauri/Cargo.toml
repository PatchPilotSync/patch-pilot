[package]
name = "patchpilot-app"
version = "0.4.3"
description = "Patch Pilot desktop app"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

# Its own workspace: Tauri's dependency tree stays out of the core crates'
# lockfile and CI jobs.
[workspace]

[lib]
name = "patchpilot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
# generate_context! emits serde_json for the plugins section of tauri.conf.json.
serde_json = "1"
patchpilot-catalog = { path = "../../crates/catalog" }
patchpilot-core = { path = "../../crates/core" }
patchpilot-local = { path = "../../crates/local" }
patchpilot-scanner = { path = "../../crates/scanner" }
patchpilot-parity = { path = "../../crates/parity" }
patchpilot-store = { path = "../../crates/store" }
patchpilot-sync = { path = "../../crates/sync" }
patchpilot-vault = { path = "../../crates/vault" }
# Live sync transport (decision #38). rustls with ring, like the updater, so no
# C toolchain is needed for aws-lc on Windows.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Quiet drift alerts (decision #48); sent from Rust only, so no JS permission.
tauri-plugin-notification = "2"
# The Rig Report's Save dialog. Rust writes the file, so no fs permissions.
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
